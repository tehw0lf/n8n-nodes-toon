rules:
  # Exclude prototype pollution loop warnings - we have explicit validation
  # All dynamic property accesses are protected by utils.isSafeKey() checks
  # which block __proto__, constructor, and prototype keys.
  - id: javascript.lang.security.audit.prototype-pollution.prototype-pollution-loop.prototype-pollution-loop
    paths:
      exclude:
        - nodes/Toon/ToonDecoder.ts
        - nodes/Toon/ToonEncoder.ts
