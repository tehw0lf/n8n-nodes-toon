# Monitor TOON Specification
#
# This workflow automatically monitors the official TOON specification repository
# for updates and creates GitHub issues when changes are detected.
#
# Schedule: Runs every Monday at 9:00 AM UTC
# Manual Trigger: Can be triggered via GitHub Actions UI or gh CLI
#
# Workflow Steps:
# 1. Fetch local SPEC.md version/date
# 2. Fetch upstream SPEC.md from https://github.com/toon-format/spec
# 3. Compare versions, then compare SPEC.md content
# 4. If changes detected:
#    - Generate diff summary (only when the content actually differs)
#    - Create GitHub issue (or update existing)
#    - Label with 'spec-update' and 'enhancement'
#    - Avoid duplicate issues for same version
#
# The spec repo versions independently of its content, so a release may ship a
# byte-identical SPEC.md (tooling-only changes). Those produce a tracking-only
# issue instead of a false "update the implementation" alarm.
#
# Issue Format:
# - Title: "TOON Specification Update Available: vX.Y" (content changed), or
#          "TOON Spec Version Bump (no content change): vX.Y"
# - Body: Version comparison, diff, action checklist, links
# - Labels: spec-update, enhancement
#
name: Monitor TOON Specification

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  issues: write

jobs:
  check-spec-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Fetch current local spec version
        id: local-version
        run: |
          # Extract implemented spec version from package.json (toonSpecVersion field)
          VERSION=$(node -p "require('./package.json').toonSpecVersion")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Local TOON spec version: ${VERSION}"

      - name: Fetch latest upstream spec
        id: upstream-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the latest release version from GitHub Releases API (more reliable than README/SPEC.md)
          RELEASE_JSON=$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/toon-format/spec/releases/latest")
          VERSION=$(echo "${RELEASE_JSON}" | grep -m1 '"tag_name"' | sed 's/.*"tag_name": *"v\?\([^"]*\)".*/\1/')
          DATE=$(echo "${RELEASE_JSON}" | grep -m1 '"published_at"' | sed 's/.*"published_at": *"\([0-9-]*\).*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "Upstream TOON spec version: ${VERSION} (${DATE})"

          # Also download the latest SPEC.md from the release tag for diffing
          curl -sSL "https://raw.githubusercontent.com/toon-format/spec/v${VERSION}/SPEC.md" -o /tmp/upstream-spec.md \
            || curl -sSL "https://raw.githubusercontent.com/toon-format/spec/main/SPEC.md" -o /tmp/upstream-spec.md

      - name: Compare versions
        id: compare
        run: |
          LOCAL_VERSION="${{ steps.local-version.outputs.version }}"
          UPSTREAM_VERSION="${{ steps.upstream-version.outputs.version }}"
          UPSTREAM_DATE="${{ steps.upstream-version.outputs.date }}"

          echo "Comparing versions:"
          echo "  Local: ${LOCAL_VERSION}"
          echo "  Upstream: ${UPSTREAM_VERSION} (released ${UPSTREAM_DATE})"

          if [ "${LOCAL_VERSION}" = "${UPSTREAM_VERSION}" ]; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
            exit 0
          fi

          echo "changes_detected=true" >> "$GITHUB_OUTPUT"

          # The spec repo versions independently of its content: tooling-only
          # releases (dependency bumps, CI changes) ship a byte-identical
          # SPEC.md. Distinguish those from real normative changes so the issue
          # can state which kind of update this is.
          if cmp -s SPEC.md /tmp/upstream-spec.md; then
            echo "spec_changed=false" >> "$GITHUB_OUTPUT"
            echo "Version bump only - SPEC.md is byte-identical upstream"
          else
            echo "spec_changed=true" >> "$GITHUB_OUTPUT"
            echo "SPEC.md content changed upstream"
          fi

      - name: Generate diff summary
        if: steps.compare.outputs.spec_changed == 'true'
        id: diff
        run: |
          # Generate a summary of changes
          echo "Generating diff summary..."

          # Create a truncated diff (first 100 lines to avoid massive issues)
          diff -u SPEC.md /tmp/upstream-spec.md | head -n 100 > /tmp/spec-diff.txt || true

          # Save diff to output
          {
            echo 'diff<<EOF'
            cat /tmp/spec-diff.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create issue for spec update
        if: steps.compare.outputs.changes_detected == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          LOCAL_VERSION: ${{ steps.local-version.outputs.version }}
          UPSTREAM_VERSION: ${{ steps.upstream-version.outputs.version }}
          UPSTREAM_DATE: ${{ steps.upstream-version.outputs.date }}
          SPEC_CHANGED: ${{ steps.compare.outputs.spec_changed }}
          SPEC_DIFF: ${{ steps.diff.outputs.diff }}
        with:
          script: |
            const localVersion = process.env.LOCAL_VERSION;
            const upstreamVersion = process.env.UPSTREAM_VERSION;
            const upstreamDate = process.env.UPSTREAM_DATE;
            const specChanged = process.env.SPEC_CHANGED === 'true';
            const diff = process.env.SPEC_DIFF;

            const issueTitle = specChanged
              ? `TOON Specification Update Available: v${upstreamVersion}`
              : `TOON Spec Version Bump (no content change): v${upstreamVersion}`;

            const heading = specChanged
              ? '## 🔔 TOON Specification Update Detected'
              : '## 📦 TOON Spec Version Bump (no content change)';

            const intro = specChanged
              ? 'A new version of the TOON specification is available from the official repository.'
              : [
                  'A new version of the TOON specification was released, but `SPEC.md` is',
                  '**byte-for-byte identical** to the copy in this repository. The spec repo',
                  'versions independently of its content, so this release only changed repo',
                  'tooling (dependencies, CI). **No implementation changes are required.**'
                ].join('\n');

            const actionSection = specChanged
              ? [
                  '### Action Required',
                  '',
                  'Please review the changes in the official specification and update our implementation accordingly:',
                  '',
                  '1. Review the upstream specification: https://github.com/toon-format/spec/blob/main/SPEC.md',
                  '2. Update `SPEC.md` to match the latest version',
                  '3. Review and update implementation in `nodes/Toon/` if needed',
                  '4. Update tests to cover any new features or changes',
                  '5. Update `README.md` to reflect the new version',
                  '6. Bump `toonSpecVersion` in `package.json` to `' + upstreamVersion + '`, take a',
                  '   patch bump on our own version, and run `npm install`',
                  '7. Review `DEVELOPMENT.md` — the spec compliance table may need new',
                  '   rows. The spec version itself is not duplicated there, so it',
                  '   needs no edit.',
                  '',
                  '### Diff Summary (first 100 lines)',
                  '',
                  '<details>',
                  '<summary>Click to expand diff</summary>',
                  '',
                  '```diff',
                  diff,
                  '```',
                  '',
                  '</details>'
                ]
              : [
                  '### Action Required',
                  '',
                  'Tracking-only update:',
                  '',
                  '1. Bump `toonSpecVersion` in `package.json` to `' + upstreamVersion + '`',
                  '2. Bump our own package version (patch only)',
                  '3. Run `npm install` so `package-lock.json` picks up the new version',
                  '',
                  '`SPEC.md`, `nodes/Toon/`, and the tests do not need to change.',
                  '',
                  'The spec version lives only in `package.json`; `DEVELOPMENT.md`',
                  'references that field rather than repeating the number, so it needs',
                  'no edit. If you find a hard-coded version anywhere else, replace it',
                  'with a reference instead of updating it.'
                ];

            const issueBody = [
              heading,
              '',
              intro,
              '',
              '### Version Information',
              '',
              `- **Current (Local):** v${localVersion}`,
              `- **Latest (Upstream):** v${upstreamVersion} (${upstreamDate})`,
              `- **SPEC.md content changed:** ${specChanged ? 'yes' : 'no (identical)'}`,
              '',
              ...actionSection,
              '',
              '### Useful Links',
              '',
              '- [Official TOON Spec Repository](https://github.com/toon-format/spec)',
              '- [Latest SPEC.md](https://github.com/toon-format/spec/blob/main/SPEC.md)',
              '- [TOON Organization](https://github.com/toon-format)',
              '',
              '---',
              '',
              '*This issue was automatically created by the [Monitor TOON Specification workflow](.github/workflows/monitor-spec.yml)*'
            ].join('\n');

            // Check if an issue already exists for this version
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'spec-update'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes(`v${upstreamVersion}`)
            );

            if (existingIssue) {
              console.log(`Issue already exists for v${upstreamVersion}: #${existingIssue.number}`);

              // Add a comment to the existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **Reminder:** This specification update is still pending.\n\nLast checked: ${new Date().toISOString()}`
              });

              // Assign if not already assigned
              const alreadyAssigned = existingIssue.assignees.some(a => a.login === context.repo.owner);
              if (!alreadyAssigned) {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  assignees: [context.repo.owner]
                });
              }
            } else {
              // Create a new issue and assign the repo owner
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['spec-update', 'enhancement'],
                assignees: [context.repo.owner]
              });

              console.log(`Created issue #${issue.data.number}`);
            }

      - name: Summary
        run: |
          if [ "${{ steps.compare.outputs.changes_detected }}" == "true" ]; then
            echo "✅ Spec update detected and issue created/updated"
          else
            echo "✅ No spec updates detected - implementation is up to date"
          fi
