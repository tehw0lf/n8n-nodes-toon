# Security Monitoring Workflow
#
# This workflow performs comprehensive security scanning using the centralized
# reusable workflow infrastructure.
#
# Schedule: Runs daily at 2:00 AM UTC to catch newly disclosed vulnerabilities
# Manual Trigger: Can be triggered via GitHub Actions UI or gh CLI
#
# Security Checks (via reusable workflow):
# - Semgrep for source code security issues (OWASP Top 10, security-audit, CI)
# - npm audit for dependency vulnerabilities
# - Trivy for artifact scanning
# - Post-publish verification (when applicable)
#
# The reusable workflow handles:
# - SARIF uploads to GitHub Security tab
# - Build artifact scanning
# - Dependency vulnerability detection
# - Issue creation via existing mechanisms
#
name: Security Monitoring

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-scan.yml'

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  # Use the centralized reusable workflow for comprehensive security scanning
  # This includes: Semgrep, npm audit, Trivy, and post-publish verification
  security_scan:
    name: Security Scan
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    permissions:
      actions: write
      attestations: write
      contents: write
      packages: write
      id-token: write
      security-events: write
    with:
      tool: "npm"
      lint: "run lint"
      test: "run test"
      build_branch: "run build"
      build_main: "run build"
      event_name: ${{ github.event_name }}
      artifact_path: "dist"
      library_path: "dist"
      publish_github_release: "false"
      enable_security_scanning: "true"
      semgrep_rules: "auto p/security-audit p/owasp-top-ten p/ci p/nodejs p/typescript"
      trivy_severity: "CRITICAL,HIGH,MEDIUM"
      trivy_exit_code: "0"  # Don't fail workflow - allow full scan to complete
      cyclonedx_ignore_npm_errors: true  # Handle package override validation
