name: build and publish pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: external workflow
    uses: tehw0lf/workflows/.github/workflows/build-test-publish.yml@main
    permissions:
      actions: write
      attestations: write
      contents: write
      packages: write
      id-token: write
      security-events: write
      pull-requests: write
    with:
      tool: "npm"
      lint: "run lint"
      test: "run test"
      build_branch: "run build"
      build_main: "run build"
      artifact_path: "dist"
      library_path: "dist"
      publish_github_release: "true"
      npm_audit_omit_dev: true
      npm_audit_severity_threshold: "high"
      cyclonedx_ignore_npm_errors: true
